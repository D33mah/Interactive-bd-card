<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Shdoo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6ecd9; --ink:#1a0b0b; --red:#c4161c; --deep:#4a0709; --gold:#f4c542;
    --w:min(300px, 72vw); --h:calc(var(--w) * 1.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0d0505 url("file:///C:/Users/adede/Downloads/bd%20card/background.jpg") center/cover fixed no-repeat;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;font-family:'VT323',monospace;color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  body::before{ /* vignette so the card pops */
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.05) 20%, rgba(0,0,0,.75) 100%);
  }
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

  .pixel{image-rendering:pixelated}

  /* ===== card ===== */
  .stage{position:relative;z-index:5;perspective:1800px;transition:transform 1s cubic-bezier(.6,.05,.2,1)}
  .stage.open{transform:translateX(calc(var(--w) / 2))}
  @media (max-width:640px){ .stage.open{transform:translateX(calc(var(--w) * .3)) scale(.6)} }
  .card{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;cursor:pointer;
        filter:drop-shadow(0 20px 40px rgba(0,0,0,.7));animation:bob 4s ease-in-out infinite}
  .stage.open .card{animation:none}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-.6deg)}}

  .inside,.cover{position:absolute;inset:0}
  .inside{background:var(--paper);border:3px solid var(--ink);padding:14px 16px;overflow:hidden;
          box-shadow:inset 40px 0 40px -20px rgba(0,0,0,.25);text-align:center}
  .cover{transform-origin:left center;transition:transform 1.1s cubic-bezier(.6,.05,.2,1);transform-style:preserve-3d;z-index:2}
  .stage.open .cover{transform:rotateY(-172deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);overflow:hidden}

  /* front */
  .front{background:var(--paper);display:flex;flex-direction:column;align-items:center;padding:12px 10px;
         box-shadow:inset 0 0 0 4px var(--red), inset 0 0 0 6px var(--paper), inset 0 0 0 8px var(--ink)}
  .front .blink{width:92%;margin-top:8px}
  .front img.cat{width:62%;margin:6px 0 4px;animation:wiggle 1.6s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .title{text-align:center;font-family:'Press Start 2P',monospace;font-size:calc(var(--w) * .062);line-height:1.5;color:var(--red);
         text-shadow:2px 2px 0 var(--ink);letter-spacing:1px}
  .hint{position:absolute;bottom:14px;font-family:'Press Start 2P';font-size:calc(var(--w) * .033);color:var(--deep);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  /* back of cover (left page when open) */
  .back{transform:rotateY(180deg);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:10px;padding:14px;box-shadow:inset -40px 0 40px -20px rgba(0,0,0,.25)}
  .back img.potato{width:88%;border:3px solid var(--ink);background:#fff}
  .back .cap{font-family:'Press Start 2P';font-size:calc(var(--w) * .036);color:var(--deep);line-height:1.6}

  /* inside right page */
  .inside h2{font-family:'Press Start 2P';font-size:calc(var(--w) * .056);color:var(--red);text-shadow:2px 2px 0 var(--ink);margin:2px 0 8px;line-height:1.5}
  .inside .blink2{width:100%;margin-bottom:8px;border:2px solid var(--ink)}
  .wishes{font-size:calc(var(--w) * .068);line-height:1.1;text-align:left;font-family:'VT323','Courier New',monospace}
  .wishes .sig{text-align:right;margin-top:6px;color:var(--red)}
  .pics{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:0 12px}
  .pics img{height:calc(var(--h) * .22);width:auto;mix-blend-mode:multiply;transition:transform .2s;cursor:pointer}
  .pics img:hover{transform:translateY(-6px) scale(1.12) rotate(-4deg)}

  /* ===== floaters ===== */
  .zombie{position:fixed;bottom:2vh;left:-30vw;width:min(180px,32vw);z-index:4;animation:walk 16s linear infinite;pointer-events:none}
  @keyframes walk{to{left:110vw}}
  .zombie.flip{animation-name:walkBack;transform:scaleX(-1)}
  .banner{position:relative;z-index:5;margin-top:26px;width:min(480px,86vw);border:3px solid var(--red);box-shadow:0 0 18px rgba(196,22,28,.7);cursor:pointer}
  .tip{position:relative;z-index:5;margin-top:10px;font-size:20px;color:#ffb3b3;text-shadow:0 0 6px #000;letter-spacing:1px}
  .hide-open{transition:opacity .6s}
  .open-state .hide-open{opacity:0}
  @media (prefers-reduced-motion:reduce){.card,.zombie,.front img.cat,.hint{animation:none}}
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <img class="zombie pixel" src="file:///C:/Users/adede/Downloads/bd%20card/download%20(10).gif" alt="" aria-hidden="true">

  <div class="stage" id="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Open birthday card">
      <div class="inside">
        <img class="blink2 pixel" src="file:///C:/Users/adede/Downloads/bd%20card/blinkiesCafe-7U.gif" alt="Happy Birthday Shdo!">
        <div class="wishes">
          <p>Dear Shdo,</p>
          <p>Happy birthday!! I hope your days are filled with joy, laughter, and lots of candy . May all your wishes come true.</p>
          <p class="sig">— Demo:p</p>
        </div>
        <div class="pics">
          <img class="pixel" id="soldier" src="file:///C:/Users/adede/Downloads/bd%20card/download%20(39).jpg" alt="pixel soldier" title="Click me!">
          <img class="pixel" id="zom2" src="C:\Users\adede\Downloads\bd card\Simondance.gif" alt="zombie" title="Click me!">
        </div>
      </div>

      <div class="cover">
        <div class="face front">
          <img class="blink pixel" src="file:///C:/Users/adede/Downloads/bd%20card/blinkiesCafe-ph.gif" alt="Shdo Ldo :3">
          <img class="cat" src="C:\Users\adede\Downloads\bd card\Simon Ghost Riley.jpg" alt="Party cat" style="mix-blend-mode:multiply">
          <div class="title">HAPPY<br>BIRTHDAY<br>SHDOOO!</div>
          <div class="hint">CLICK TO OPEN</div>
        </div>
        <div class="face back">
          <img class="potato" src="file:///C:/Users/adede/Downloads/bd%20card/download%20(37).jpg" alt="Party potato">
          <div class="cap">MAKE A WISH<br>★ ★ ★</div>
        </div>
      </div>
    </div>
  </div>

  <img class="banner pixel hide-open" id="banner" src="file:///C:/Users/adede/Downloads/bd%20card/blinkiesCafe-ph.gif" alt="Shdo Ldo :3">
  <div class="tip hide-open">tap the card · tap anywhere you want! ✦</div>

<script>
(() => {
  const stage = document.getElementById('stage'), card = document.getElementById('card');
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let W, H, bits = [];
  const fit = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  addEventListener('resize', fit); fit();

  const colors = ['#c4161c','#f4c542','#ffffff','#ff5a5f','#7bd88f','#5ec8ff'];
  function burst(x, y, n = 90){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = 3+Math.random()*9;
      bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,sz:4+Math.random()*6|0,
                 c:colors[Math.random()*colors.length|0],life:120+Math.random()*60});
    }
  }
  function rain(n = 60){
    for(let i=0;i<n;i++) bits.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
      sz:4+Math.random()*6|0,c:colors[Math.random()*colors.length|0],life:300});
  }
  (function loop(){
    ctx.clearRect(0,0,W,H);
    bits = bits.filter(b => b.life-- > 0 && b.y < H+20);
    for(const b of bits){
      b.x += b.vx; b.y += b.vy; b.vy += .18; b.vx *= .99;
      ctx.globalAlpha = Math.min(1, b.life/40);
      ctx.fillStyle = b.c; ctx.fillRect(b.x|0, b.y|0, b.sz, b.sz);
    }
    requestAnimationFrame(loop);
  })();

  function toggle(){
    const open = stage.classList.toggle('open');
    document.body.classList.toggle('open-state', open);
    if(open){
      setTimeout(() => { burst(innerWidth/2, innerHeight/2); rain(); }, 500);
    }
  }
  card.addEventListener('click', e => { if(e.target.closest('.pics')) return; toggle(); });
  card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }});

  // extra interactions
  document.querySelectorAll('.pics img').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); burst(e.clientX, e.clientY, 50); }));
  document.addEventListener('pointerdown', e => { if(!e.target.closest('#card')) burst(e.clientX, e.clientY, 25); });
})();
</script>
</body>
</html>
